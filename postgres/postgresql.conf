# =============================================================================
# KONFIGURASI TUNING POSTGRESQL — IoT Platform TIP
# Target: PostgreSQL 15 dengan beban IoT (banyak write kecil, read query analitik)
#
# METODOLOGI TUNING:
# Nilai-nilai ini dihitung berdasarkan asumsi server dengan RAM 4GB.
# Sesuaikan jika RAM server berbeda:
#   RAM 2GB  → shared_buffers=512MB, effective_cache_size=1GB, work_mem=8MB
#   RAM 4GB  → shared_buffers=1GB, effective_cache_size=2GB, work_mem=16MB (default ini)
#   RAM 8GB  → shared_buffers=2GB, effective_cache_size=6GB, work_mem=32MB
#
# Referensi: https://pgtune.leopard.in.ua/
# =============================================================================

# -----------------------------------------------------------------------------
# KONEKSI
# -----------------------------------------------------------------------------
# Batas maksimal koneksi simultan ke PostgreSQL.
# Mengapa 100 dan bukan lebih?
# FastAPI menggunakan connection pooling (SQLAlchemy + asyncpg).
# Pool yang bagus: 10-20 koneksi per worker sudah lebih dari cukup.
# Terlalu banyak koneksi justru overhead (setiap koneksi butuh ~5MB RAM).
max_connections = 100

# -----------------------------------------------------------------------------
# MEMORI
# -----------------------------------------------------------------------------
# Alokasi memori untuk cache PostgreSQL.
# Rule of thumb: 25% dari total RAM server.
# Dengan RAM 4GB → 25% = 1GB = 1024MB
shared_buffers = 256MB

# Memori yang bisa dipakai PER OPERASI (sort, hash join, dll).
# Dengan 100 koneksi, total bisa 100 * 16MB = 1.6GB di worst case.
# Tapi dalam praktik, hanya sebagian koneksi aktif sekaligus.
work_mem = 16MB

# Memori untuk operasi maintenance (VACUUM, CREATE INDEX, ALTER TABLE).
# Tidak mempengaruhi query normal — hanya untuk background maintenance.
maintenance_work_mem = 128MB

# Estimasi ukuran cache OS yang tersedia untuk PostgreSQL.
# Ini BUKAN alokasi nyata — hanya petunjuk untuk query planner.
# Rule of thumb: 75% dari total RAM server.
effective_cache_size = 768MB

# -----------------------------------------------------------------------------
# WRITE-AHEAD LOG (WAL) — Durabilitas & Performa Write
# -----------------------------------------------------------------------------
# Tingkat informasi yang dicatat di WAL.
# - minimal: hanya crash recovery
# - replica: + replikasi streaming (pilih ini agar siap scale)
# - logical: + logical replication (tidak perlu sekarang)
wal_level = replica

# Batasan ukuran buffer WAL di memori sebelum flush ke disk.
# Nilai -1 = auto (1/32 dari shared_buffers, minimal 64kB, maks 16MB).
wal_buffers = -1

# Seberapa sering checkpoint terjadi (dalam satuan waktu).
# Lebih jarang = lebih efisien (less I/O), tapi recovery lebih lama jika crash.
# 5 menit adalah trade-off yang bagus untuk IoT.
checkpoint_completion_target = 0.9
checkpoint_timeout = 5min

# Ukuran maksimum WAL antara dua checkpoint.
# Lebih besar = I/O lebih efisien. Rule of thumb: RAM * 0.25 untuk write-heavy apps.
max_wal_size = 1GB
min_wal_size = 80MB

# -----------------------------------------------------------------------------
# QUERY PLANNER
# -----------------------------------------------------------------------------
# Biaya I/O disk relatif terhadap operasi memori.
# SSD jauh lebih cepat dari HDD, jadi random I/O tidak terlalu mahal.
# - HDD: random_page_cost = 4.0 (default)
# - SSD: random_page_cost = 1.1 (lebih rendah = planner lebih pilih index scan)
random_page_cost = 1.1

# Algoritma JIT (Just-In-Time) compilation untuk query analitik berat.
# Untuk IoT dengan banyak query kecil dan cepat, JIT justru overhead.
# Nonaktifkan untuk menghindari latency tambahan.
jit = off

# -----------------------------------------------------------------------------
# PARALLELISME
# -----------------------------------------------------------------------------
# Batas CPU yang bisa dipakai untuk satu query paralel.
# Gunakan sesuai jumlah CPU server. Nilai 2 aman untuk development.
max_parallel_workers_per_gather = 2
max_parallel_workers = 4
max_worker_processes = 8

# -----------------------------------------------------------------------------
# LOGGING — Monitoring & Debugging Production
# -----------------------------------------------------------------------------
# Catat query yang berjalan lebih lama dari N milidetik.
# -1 = matikan logging, 0 = log semua (terlalu banyak), 500ms = sweet spot produksi.
# Berguna untuk identifikasi query yang butuh optimasi.
log_min_duration_statement = 500

# Format log: lebih informatif untuk parsing dengan tool monitoring.
log_line_prefix = '%t [%p]: user=%u,db=%d,app=%a,client=%h '

# Catat informasi checkpoint untuk monitoring.
log_checkpoints = on

# Catat koneksi dan disconnection (berguna untuk audit).
log_connections = off     # off karena IoT banyak short-lived connections, terlalu noisy
log_disconnections = off

# Catat operasi yang menggunakan disk sementara (sign ada work_mem kurang).
log_temp_files = 10MB

# Format timestamp di log.
log_timezone = 'Asia/Jakarta'

# -----------------------------------------------------------------------------
# TIMEZONE
# -----------------------------------------------------------------------------
timezone = 'UTC'
# PENTING: Simpan semua timestamp di DB dalam UTC!
# Konversi ke WIB (Asia/Jakarta, UTC+7) dilakukan di level aplikasi.
# Ini best practice karena: tidak ada ambiguitas DST, query range tetap konsisten.

# -----------------------------------------------------------------------------
# MONITORING (pg_stat_statements)
# -----------------------------------------------------------------------------
# Aktifkan tracking statistik query.
# Wajib dipreload saat PostgreSQL start; perubahan ini perlu restart container DB.
shared_preload_libraries = 'timescaledb,pg_stat_statements'
pg_stat_statements.track = all
pg_stat_statements.max = 10000
