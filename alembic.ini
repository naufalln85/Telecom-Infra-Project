# =============================================================================
# KONFIGURASI ALEMBIC — IoT Platform TIP (Modul A)
# Alembic adalah migration tool resmi untuk SQLAlchemy (Python).
#
# Cara pakai:
#   alembic upgrade head          ← jalankan semua migrasi
#   alembic downgrade -1          ← rollback 1 langkah
#   alembic downgrade base        ← rollback semua
#   alembic current               ← cek versi DB sekarang
#   alembic history               ← lihat history migrasi
#   alembic revision --autogenerate -m "nama perubahan"  ← buat file migrasi baru
# =============================================================================

[alembic]
# Path ke folder yang berisi file migrasi (relatif dari root project)
script_location = db/migrations

# Template nama file migrasi yang dibuat
# Format: {tahun}{bulan}{hari}_{jam}{menit}_{rev}_{slug}.py
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# Direktori tempat Alembic mencari file Python untuk import
prepend_sys_path = .

# Timezone untuk nama file migrasi
timezone = Asia/Jakarta

# Panjang revision ID (default 12 karakter)
revision_environment = false

# URL koneksi ke database.
# PENTING: Alembic butuh koneksi SYNC (bukan asyncpg).
# Baca dari environment variable — tidak perlu hardcode di sini.
# Nilai ini di-override di env.py dari DATABASE_URL_SYNC di .env
sqlalchemy.url = driver://user:pass@localhost/dbname

[post_write_hooks]
# Hook setelah file migrasi dibuat (opsional: auto-format dengan black)
# Aktifkan jika sudah install black: pip install black
# hooks = black
# black.type = console_scripts
# black.entrypoint = black
# black.options = -l 88 REVISION_SCRIPT_FILENAME

# -----------------------------------------------------------------------------
# LOGGING — Output dari Alembic saat dijalankan
# -----------------------------------------------------------------------------
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
