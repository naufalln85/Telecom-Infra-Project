# =============================================================================
# Docker Compose — IoT Platform Multi-Tenant (Full Stack Production Stack)
# Stack: PostgreSQL 15 + TimescaleDB HA | Redis 7 | FastAPI Backend | AI Serving | React Frontend (Nginx)
# Frontend: Colorful IoT Dashboard Design (Figma → React + TypeScript + Vite)
# =============================================================================

name: iot-platform-tip

services:

  # ---------------------------------------------------------------------------
  # DATABASE: PostgreSQL 15 + TimescaleDB High Availability
  # ---------------------------------------------------------------------------
  db:
    image: timescale/timescaledb-ha:pg15-latest
    container_name: tip_postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be set}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB must be set}
      POSTGRESQL_CONF_shared_preload_libraries: "timescaledb,pg_stat_statements"

    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"

    volumes:
      - postgres_data:/home/postgres/pgdata/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
      - ./postgres/postgresql.conf:/etc/postgresql/postgresql.conf:ro

    command: >
      postgres
      -c config_file=/etc/postgresql/postgresql.conf

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:?POSTGRES_USER must be set} -d ${POSTGRES_DB:?POSTGRES_DB must be set}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

    networks:
      - iot_platform_net

  # ---------------------------------------------------------------------------
  # CACHE & EVENT BUS: Redis 7
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7.2-alpine
    container_name: tip_redis
    restart: unless-stopped

    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
      --appendonly yes
      --appendfsync everysec
      --maxmemory ${REDIS_MAXMEMORY:-512mb}
      --maxmemory-policy allkeys-lru

    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"

    volumes:
      - redis_data:/data

    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:?REDIS_PASSWORD must be set}", "PING"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    networks:
      - iot_platform_net

  # ---------------------------------------------------------------------------
  # BACKEND API: FastAPI (demo_app)
  # Entrypoint otomatis: Alembic migrate → Seed data → Start server
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: demo_app/Dockerfile
    container_name: tip_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be set}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB must be set}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:?POSTGRES_USER must be set}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@db:5432/${POSTGRES_DB:?POSTGRES_DB must be set}
      DATABASE_URL_SYNC: postgresql://${POSTGRES_USER:?POSTGRES_USER must be set}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@db:5432/${POSTGRES_DB:?POSTGRES_DB must be set}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
      REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD must be set}@redis:6379/0
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY must be set}
      CORS_ORIGINS: ${CORS_ORIGINS:?CORS_ORIGINS must be set}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8000/api/status"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 45s
    networks:
      - iot_platform_net

  # ---------------------------------------------------------------------------
  # AI SERVING MODULE: ONNX Inference API
  # ---------------------------------------------------------------------------
  ai-serving:
    build:
      context: ./AI SERVING
      dockerfile: Dockerfile
    container_name: tip_ai_serving
    restart: unless-stopped
    ports:
      - "8001:8001"
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
      SANDBOX_HOST: ai-sandbox
      SANDBOX_PORT: 9000
    volumes:
      - ai_models:/app/uploads
      - ai_registry:/app/data
    depends_on:
      redis:
        condition: service_healthy
      ai-sandbox:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8001/health"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - iot_platform_net

  # Isolated inference runtime.  Models are shared read-only from a named
  # volume; the API container never needs host Docker socket access.
  ai-sandbox:
    build:
      context: ./AI SERVING/container_app
      dockerfile: Dockerfile
    container_name: tip_ai_sandbox
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - ai_models:/sandbox/models:ro
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import socket; s=socket.create_connection(('127.0.0.1', 9000), 2); s.close()\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - iot_platform_net

  # Redis Streams worker for asynchronous AI jobs.
  ai-worker:
    build:
      context: ./AI SERVING
      dockerfile: Dockerfile
    container_name: tip_ai_worker
    restart: unless-stopped
    command: ["python", "-m", "app.worker.redis_consumer"]
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
      SANDBOX_HOST: ai-sandbox
      SANDBOX_PORT: 9000
      PLATFORM_HMAC_SECRET: ${PLATFORM_HMAC_SECRET:-}
    volumes:
      - ai_models:/app/uploads:ro
      - ai_registry:/app/data:ro
    depends_on:
      redis:
        condition: service_healthy
      ai-sandbox:
        condition: service_healthy
    networks:
      - iot_platform_net

  # ---------------------------------------------------------------------------
  # FRONTEND UI: Colorful IoT Dashboard Design
  # React + TypeScript + Vite + TailwindCSS → served via Nginx
  # Proxy /api/ → backend:8000 | /gateway/ → iot-gateway:3000
  # ---------------------------------------------------------------------------
  frontend:
    build:
      context: ./DB Relation/Colorful IoT Dashboard Design
      dockerfile: Dockerfile
    container_name: tip_frontend
    restart: unless-stopped
    expose:
      - "80"
    depends_on:
      backend:
        condition: service_healthy
      iot-gateway:
        condition: service_started
    networks:
      - iot_platform_net

  # ---------------------------------------------------------------------------
  # IOT GATEWAY: Multi-Protocol Ingestion (HTTP + MQTT + CoAP) — Modul B
  # ---------------------------------------------------------------------------
  iot-gateway:
    build:
      context: ./iot-gateway
      dockerfile: Dockerfile
    container_name: tip_iot_gateway
    restart: unless-stopped

    ports:
      - "${GATEWAY_MQTT_PORT:-1884}:1884"       # MQTT Broker (Aedes)
      - "${GATEWAY_COAP_PORT:-5683}:5683/udp"   # CoAP UDP Server

    environment:
      BACKEND_URL: http://backend:8000/api/v2/telemetry
      GATEWAY_HTTP_PORT: 3000
      GATEWAY_MQTT_PORT: 1884
      GATEWAY_COAP_PORT: 5683

    depends_on:
      backend:
        condition: service_started

    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

    networks:
      - iot_platform_net

  # Single public entrypoint.  Provide PUBLIC_DOMAIN in .env and point its DNS
  # A/AAAA record here; Caddy obtains and renews HTTPS certificates automatically.
  web:
    image: caddy:2.8-alpine
    container_name: tip_web
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      frontend:
        condition: service_started
    networks:
      - iot_platform_net

# =============================================================================
# VOLUMES
# =============================================================================
volumes:
  postgres_data:
    name: tip_postgres_data
  redis_data:
    name: tip_redis_data
  ai_models:
    name: tip_ai_models
  ai_registry:
    name: tip_ai_registry
  caddy_data:
    name: tip_caddy_data
  caddy_config:
    name: tip_caddy_config

# =============================================================================
# NETWORKS
# =============================================================================
networks:
  iot_platform_net:
    name: tip_internal_net
    driver: bridge
