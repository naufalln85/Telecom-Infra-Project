# =============================================================================
# Docker Compose — IoT Platform Multi-Tenant (Full Stack Production Stack)
# Stack: PostgreSQL 15 + TimescaleDB HA | Redis 7 | FastAPI Backend | AI Serving | React Frontend (Nginx)
# Frontend: Colorful IoT Dashboard Design (Figma → React + TypeScript + Vite)
# =============================================================================

name: iot-platform-tip

services:

  # ---------------------------------------------------------------------------
  # DATABASE: PostgreSQL 15 + TimescaleDB High Availability
  # ---------------------------------------------------------------------------
  db:
    image: timescale/timescaledb-ha:pg15-latest
    container_name: tip_postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tip_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-w10VCG9XJoZN46btfiBhrzsJ}
      POSTGRES_DB: ${POSTGRES_DB:-iot_platform_tip}
      POSTGRESQL_CONF_shared_preload_libraries: "timescaledb,pg_stat_statements"

    ports:
      - "${POSTGRES_PORT:-5432}:5432"

    volumes:
      - postgres_data:/home/postgres/pgdata/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
      - ./postgres/postgresql.conf:/etc/postgresql/postgresql.conf:ro

    command: >
      postgres
      -c config_file=/etc/postgresql/postgresql.conf

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tip_admin} -d ${POSTGRES_DB:-iot_platform_tip}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

    networks:
      - iot_platform_net

  # ---------------------------------------------------------------------------
  # CACHE & EVENT BUS: Redis 7
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7.2-alpine
    container_name: tip_redis
    restart: unless-stopped

    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:-x7TrLTJmZaRkPZpWzS3BD4Xl}
      --appendonly yes
      --appendfsync everysec
      --maxmemory ${REDIS_MAXMEMORY:-512mb}
      --maxmemory-policy allkeys-lru

    ports:
      - "${REDIS_PORT:-6379}:6379"

    volumes:
      - redis_data:/data

    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-x7TrLTJmZaRkPZpWzS3BD4Xl}", "PING"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    networks:
      - iot_platform_net

  # ---------------------------------------------------------------------------
  # BACKEND API: FastAPI (demo_app)
  # Entrypoint otomatis: Alembic migrate → Seed data → Start server
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: demo_app/Dockerfile
    container_name: tip_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tip_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-w10VCG9XJoZN46btfiBhrzsJ}
      POSTGRES_DB: ${POSTGRES_DB:-iot_platform_tip}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-tip_admin}:${POSTGRES_PASSWORD:-w10VCG9XJoZN46btfiBhrzsJ}@db:5432/${POSTGRES_DB:-iot_platform_tip}
      DATABASE_URL_SYNC: postgresql://${POSTGRES_USER:-tip_admin}:${POSTGRES_PASSWORD:-w10VCG9XJoZN46btfiBhrzsJ}@db:5432/${POSTGRES_DB:-iot_platform_tip}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-x7TrLTJmZaRkPZpWzS3BD4Xl}
      REDIS_URL: redis://:${REDIS_PASSWORD:-x7TrLTJmZaRkPZpWzS3BD4Xl}@redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-4c3a56ae12d5f21cee24051b1764e5bd70dccff4d3c316f7268550f532d1997e}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8000/api/status"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 45s
    networks:
      - iot_platform_net

  # ---------------------------------------------------------------------------
  # AI SERVING MODULE: ONNX Inference & Sandbox (AI SERVING)
  # ---------------------------------------------------------------------------
  ai-serving:
    build:
      context: ./AI SERVING
      dockerfile: Dockerfile
    container_name: tip_ai_serving
    restart: unless-stopped
    ports:
      - "8001:8001"
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-x7TrLTJmZaRkPZpWzS3BD4Xl}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - iot_platform_net

  # ---------------------------------------------------------------------------
  # FRONTEND UI: Colorful IoT Dashboard Design
  # React + TypeScript + Vite + TailwindCSS → served via Nginx
  # Proxy /api/ → backend:8000 | /gateway/ → iot-gateway:3000
  # ---------------------------------------------------------------------------
  frontend:
    build:
      context: ./DB Relation/Colorful IoT Dashboard Design
      dockerfile: Dockerfile
    container_name: tip_frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy
      iot-gateway:
        condition: service_started
    networks:
      - iot_platform_net

  # ---------------------------------------------------------------------------
  # IOT GATEWAY: Multi-Protocol Ingestion (HTTP + MQTT + CoAP) — Modul B
  # ---------------------------------------------------------------------------
  iot-gateway:
    build:
      context: ./iot-gateway
      dockerfile: Dockerfile
    container_name: tip_iot_gateway
    restart: unless-stopped

    ports:
      - "${GATEWAY_HTTP_PORT:-3000}:3000"       # HTTP Telemetry Ingestion
      - "${GATEWAY_MQTT_PORT:-1884}:1884"       # MQTT Broker (Aedes)
      - "${GATEWAY_COAP_PORT:-5683}:5683/udp"   # CoAP UDP Server

    environment:
      BACKEND_URL: http://backend:8000/api/v2/telemetry
      GATEWAY_HTTP_PORT: 3000
      GATEWAY_MQTT_PORT: 1884
      GATEWAY_COAP_PORT: 5683

    depends_on:
      backend:
        condition: service_started

    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

    networks:
      - iot_platform_net

# =============================================================================
# VOLUMES
# =============================================================================
volumes:
  postgres_data:
    name: tip_postgres_data
  redis_data:
    name: tip_redis_data

# =============================================================================
# NETWORKS
# =============================================================================
networks:
  iot_platform_net:
    name: tip_internal_net
    driver: bridge
